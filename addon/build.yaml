labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Govee to MQTT Bridge"
  org.opencontainers.image.description: "Acts as a bridge between Govee devices and Home Assistant, via the Home Assistant MQTT Integration."
  org.opencontainers.image.source: "https://github.com/MatrixJson/govee2mqtt"
  org.opencontainers.image.licenses: "MIT"

# We need to specify these explicitly otherwise :latest will be
# used by the builder, and that will fail the cosign chain of trust.
# This should probably be kept in sync with the settings in
# https://github.com/home-assistant/builder/blob/master/build.yaml
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base-debian:bookworm"
  amd64: "ghcr.io/home-assistant/amd64-base-debian:bookworm"
# There is deliberately no cosign block here. Its presence makes the builder
# verify the base images above against base_identity, whether or not the
# --cosign flag is passed, and those images currently report
# "no signatures found", which fails the build. base_identity was upstream's
# value unchanged, so this is not specific to this fork. To restore signing
# once Home Assistant signs its base images again, put back:
#
# cosign:
#   identity: https://github.com/MatrixJson/govee2mqtt/.*
#   base_identity: https://github.com/home-assistant/docker-base/.*
