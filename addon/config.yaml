name: Govee to MQTT Bridge (MatrixJson fork)
image: ghcr.io/matrixjson/govee2mqtt-{arch}
# Bump this on every deploy. The builder tags the published image with this
# exact value, and Home Assistant pulls image:version, so the two must match.
version: "2026.08.29.5"
slug: govee2mqtt
description: Control Govee Devices
url: https://github.com/MatrixJson/govee2mqtt
arch:
  - amd64
  - aarch64
init: false
startup: services
services:
  - mqtt:need

apparmor: true

webui: http://[HOST]:[PORT:8056]/assets/index.html
#ingress: true
#ingress_port: 8056

# Host network access is required for LAN discovery
host_network: true

map:
  - type: addon_config
    read_only: false
    path: /app/config

options:
  temperature_scale: "C"

schema:
  temperature_scale: "str?"
  govee_email: "str?"
  govee_password: "password?"
  govee_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  debug_level: "str?"
  no_multicast: "bool?"
  broadcast_all: "bool?"
  global_broadcast: "bool?"
  scan: "str?"
